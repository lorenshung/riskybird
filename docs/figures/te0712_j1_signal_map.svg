<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" width="1020" height="560" role="img" aria-labelledby="title desc" font-family="Inter, Helvetica, Arial, sans-serif">
<title id="title">RiskyBird signals on the TE0712 J1 header</title>
<desc id="desc">Every signal&#x27;s J1 position, read from the Trenz board file, split by connector row and coloured by what this bench has observed.</desc>
<style>.bg{fill:#ffffff} .tx{fill:#111827} .ax{stroke:#6b7280} .gr{stroke:#d1d5db}@media (prefers-color-scheme: dark){.bg{fill:#0b0f19} .tx{fill:#e5e7eb} .ax{stroke:#9ca3af} .gr{stroke:#374151}}:root[data-theme="dark"] .bg{fill:#0b0f19}:root[data-theme="dark"] .tx{fill:#e5e7eb}:root[data-theme="dark"] .ax{stroke:#9ca3af}:root[data-theme="dark"] .gr{stroke:#374151}:root[data-theme="light"] .bg{fill:#ffffff}:root[data-theme="light"] .tx{fill:#111827}</style>
<rect class="bg" x="0" y="0" width="1020" height="560"/>
<text class="tx" x="78" y="34" font-size="17" font-weight="600">Every signal that works is on an even J1 pin. The one that doesn&#8217;t is odd.</text>
<text class="tx" x="78" y="56" font-size="12" opacity="0.75">TE0712 drone carrier &#183; positions read from arty_files/te0712-rd/board_files/TE0712_200_2C/1.0/part0_pins.xml</text>
<text class="tx" x="78" y="74" font-size="12" opacity="0.75">Motors 1 and 3 sit on odd pins, so they carry the console UART&#8217;s risk; motors 2 and 4 do not.</text>
