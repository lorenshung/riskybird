<title id="title">Motor PWM duty: requested versus what reaches the pin</title>
<desc id="desc">Measured on the PWMTimer elaborated by RocketArty200TMotorSpadConfig, driven by Zephyr&#x27;s sifive PWM driver register sequence.</desc>
