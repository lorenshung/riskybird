<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 550" width="848" height="550" role="img" aria-labelledby="title desc" font-family="Inter, Helvetica, Arial, sans-serif">
<title id="title">TE0712 FTDI-carrier DDR3 bring-up shell on the Y100T: where the LUTs go</title>
<desc id="desc">RocketArty100TFtdiDDRConfig, post-route on xc7a100tfgg484-2: 46,786 LUTs total, 73.8% of the device&#x27;s 63,400. The MIG alone is 10,468 (22.4% of the design). Vivado 2023.1, 50 MHz</desc>
<style>.bg{fill:#ffffff} .tx{fill:#111827} .ax{stroke:#6b7280} .gr{stroke:#d1d5db}@media (prefers-color-scheme: dark){.bg{fill:#0b0f19} .tx{fill:#e5e7eb} .ax{stroke:#9ca3af} .gr{stroke:#374151}}:root[data-theme="dark"] .bg{fill:#0b0f19}:root[data-theme="dark"] .tx{fill:#e5e7eb}:root[data-theme="dark"] .ax{stroke:#9ca3af}:root[data-theme="dark"] .gr{stroke:#374151}:root[data-theme="light"] .bg{fill:#ffffff}:root[data-theme="light"] .tx{fill:#111827}</style>
<rect class="bg" x="0" y="0" width="848" height="550"/>
<text class="tx" x="16" y="28" font-size="15" font-weight="600">TE0712 FTDI-carrier DDR3 bring-up shell on the Y100T: where the LUTs go</text>
<text class="tx" x="16" y="47" font-size="11" opacity="0.75">RocketArty100TFtdiDDRConfig, post-route on xc7a100tfgg484-2: 46,786 LUTs total, 73.8% of the device&#x27;s 63,400. The MIG alone is 10,468 (22.4% of the design). Vivado 2023.1, 50 MHz</text>
