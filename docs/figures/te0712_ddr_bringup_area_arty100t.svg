<text class="tx" x="419.0" y="60" font-size="10" text-anchor="middle" opacity="0.7">20K</text>
<line class="gr" x1="523.0" y1="66" x2="523.0" y2="498" stroke-width="1"/>
<text class="tx" x="523.0" y="60" font-size="10" text-anchor="middle" opacity="0.7">30K</text>
