<text class="tx" x="731.0" y="60" font-size="10" text-anchor="middle" opacity="0.7">50K</text>
<text class="tx" x="471.0" y="44" font-size="10" text-anchor="middle" opacity="0.6">LUTs</text>
<text class="tx" x="201" y="96" font-size="11" text-anchor="end">RocketTile (huge, FPU + MulDiv)</text>
