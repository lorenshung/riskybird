# arty200t_rocket.cfg — OpenOCD config for the riskybird FPGA (TE0712 / XC7A200T) Rocket SoC.
#
# The Rocket debug interface + console come out on the "binary" FTDI (enumerates 0403:6010):
#   channel 0 = RISC-V debug JTAG   (this file)
#   channel 1 = the RISC-V console UART  -> /dev/ttyUSB1 @ 115200
#
# Adapter pin values are from zephyr-chipyard-sw/tools/Baremetal-IDE/fpga.cfg; the RISC-V DTM/target
# is from chipyard generators/rocket-chip/scripts/RocketSim.cfg. Used by scripts/load_elf_to_soc.sh.
# (Verified: a self-built Zephyr hello_world loads + prints on ttyUSB1 through this config.)

adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0B00 0x0B0B
ftdi layout_signal nSRST -data 0x0100 -oe 0x0100
ftdi layout_signal nTRST -data 0x0200 -oe 0x0200

# Disambiguate identical FTDIs (both blank-serial 0403:6010) by USB location if both are plugged:
#   export FTDI_LOCATION=<bus>:<port>   (see `lsusb -t`)
if {[info exists ::env(FTDI_LOCATION)]} { ftdi location $::env(FTDI_LOCATION) }
if {[info exists ::env(FTDI_SPEED)]}    { adapter speed $::env(FTDI_SPEED) } else { adapter speed 2000 }

reset_config none
transport select jtag

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME
riscv set_command_timeout_sec 20
