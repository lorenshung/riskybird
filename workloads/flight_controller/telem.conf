# Telemetry build overlay (opt-in via EXTRA_CONF_FILE=telem.conf).
#   (1) Reclaim the unused 320 KB main stack (a TinyMPC-era leftover; the PID flight build does
#       NOT link TinyMPC -- see docs/FC_RAM_ANALYSIS.md). 64 KB is conservative vs the ~24-32 KB
#       the analysis says is enough.
#   (2) Enable on-chip 2.4 GHz WiFi + IPv4/UDP for the SoftAP telemetry downlink (docs/TELEMETRY_PLAN.md).
# PURPOSE NOW: measure the combined FC+WiFi SRAM footprint (the plan's gate).
# SAFETY: the PID control loop runs on the MAIN thread, so verify the runtime main-stack high-water
# (CONFIG_INIT_STACKS -> `kernel stacks`) before FLYING this build; an undersized main stack = crash.
CONFIG_MAIN_STACK_SIZE=65536
CONFIG_INIT_STACKS=y

# --- WiFi + IPv4/UDP networking (SoftAP + UDP downlink) ---
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
# SoftAP-only single-interface mode (NOT AP+STA co-existence): one WiFi interface driven into AP
# mode. Lighter on RAM and deterministic. NOTE: in this mode the esp32 driver registers no
# NM-managed SAP interface, so telem_wifi.c uses net_if_get_first_wifi() (see the fallback there).
CONFIG_ESP32_WIFI_AP_STA_MODE=n
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
# REQUIRED: deliver the wifi_ap_sta_info payload (client MAC) with the AP_STA_CONNECTED event.
# Without it cb->info is NULL and the join handler NULL-derefs -> firmware crash the instant a client
# associates (the original "can't connect" symptom). telem_wifi.c also NULL-guards defensively.
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_IF_MAX_IPV4_COUNT=1
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
# The WiFi mgmt-event callback (telem_wifi's wifi_event_handler) runs on the net-mgmt event thread
# and calls printk(). This board enables CONFIG_CBPRINTF_FP_SUPPORT, which makes cbprintf use a deep
# stack, so the default 2048 B net-mgmt event stack OVERFLOWED on client association (intermittent
# z_check_stack_sentinel fatal -> AP dropped == "can't stay connected"). 4096 B fixes it.
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
# ROOT CAUSE of the ~1 s-after-join crash: the DHCPv4 server runs an ICMP address-conflict probe and
# a k_work_delayable lease-timeout on the SYSTEM WORKQUEUE. That deep net path (plus FP-cbprintf)
# overflowed the default 1024 B sys-workq stack right when a client's DHCP completed -> heap/scheduler
# corruption -> load-access fault in z_riscv_switch. 4096 B fixes it. (Confirmed: the faulting SP was
# inside sys_work_q_stack.)
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ENTROPY_GENERATOR=y
CONFIG_HEAP_MEM_POOL_SIZE=98304
