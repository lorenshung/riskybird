# RoSE co-sim target: bridge driver + protocol + virtual sensor drivers (bound by
# boards/spike_riscv64.overlay). The app reads them through the standard sensor API.
CONFIG_ROSE=y
CONFIG_ROSE_PROTOCOL=y
CONFIG_ROSE_SENSOR_IMU=y
CONFIG_ROSE_SENSOR_FLOW=y
CONFIG_ROSE_SENSOR_TOF=y

CONFIG_PICOLIBC=y
CONFIG_COMMON_LIBC_MALLOC=y

# spike_riscv64 has a hardware FPU (the estimator uses float math).
CONFIG_FPU=y

# Kernel tick: 1000 Hz, as on the drone (hardware/zephyr/fpga.conf). The board default here was 100 Hz,
# and the control loop ends with k_usleep(300) (it paces the ~1.3 kHz hardware loop): at 100 Hz that
# sleep rounds up to the next 10 ms tick, so the co-sim loop idled ~15 ms per iteration and ran at
# 40-48 Hz instead of being limited by its sensor reads. -DCONFIG_SYS_CLOCK_TICKS_PER_SEC=100 restores it.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
