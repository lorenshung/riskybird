# FT-LINK adapter used by the existing RiskyBird bare-metal infrastructure.
#
# Device selection needs more than the VID:PID pair. A drone bench has several
# FTDI MPSSE devices on it at once -- the bitstream adapter, the Zephyr
# adapter, and the TE0712 module's own FTDI -- and OpenOCD takes whichever
# libusb enumerates first. That is a coin flip, and losing it looks exactly
# like a wiring fault: "JTAG scan chain interrogation failed: all ones".
#
# Both PIDs are listed because the dev-board adapters are not always the same
# part: 0x6010 is the FT2232H (dual channel, "Dual RS232-HS") and 0x6011 is the
# FT4232H (quad channel, "Quad RS232-HS"). Channel A is the MPSSE JTAG channel
# on both. Pinning one PID silently excludes the other, and because the guard
# in `rb debug` counts the same set, an excluded adapter does not raise an
# ambiguity error -- it falls through to whatever else matches and produces the
# all-ones scan this comment is about.
#
# There is deliberately no `device_desc` filter. It used to exclude the Trenz
# module ("Trenz USB Device"), but it cannot separate the two dev-board
# adapters -- those ship with a blank EEPROM, so they report an identical
# manufacturer, product and empty serial number -- and a fixed string rejects
# whichever of Dual/Quad is not spelled here. USB topology is the only thing
# that distinguishes them, hence RB_FTDI_LOCATION.
#
#   rb debug --usb-location 7-1.1.4.1 ...
#   RB_FTDI_LOCATION=7-1.1.4.1 openocd -f hardware/openocd/ft-link.cfg ...
#
# Find the value with `rb probe-ftdi`. It is a bus-port path, not a bus:device
# pair, so it survives replugging into the same physical port; it changes if
# the adapter moves to a different port or hub.
adapter driver ftdi
adapter speed 2000
adapter srst pulse_width 10000
reset_config none

ftdi vid_pid 0x0403 0x6010 0x0403 0x6011
if {[info exists env(RB_FTDI_LOCATION)] && $env(RB_FTDI_LOCATION) ne ""} {
	adapter usb location $env(RB_FTDI_LOCATION)
}
ftdi channel 0
ftdi layout_init 0x0B00 0x0B0B
ftdi layout_signal nSRST -data 0x0100 -oe 0x0100
ftdi layout_signal nTRST -data 0x0200 -oe 0x0200
ftdi layout_signal JTAG_LED -oe 0x0800
ftdi tdo_sample_edge rising

transport select jtag
