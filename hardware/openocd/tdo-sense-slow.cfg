# Slow variant of tdo-sense.cfg: 48 samples over ~1.2 s, for catching a
# toggling signal (see hardware/diag/ku040_heartbeat.v) rather than a static level.
# Static TDO probe for the FT-LINK adapter -- a bench instrument, not a debug target.
#
# Reads ADBUS2 (TDO) as a plain input via "ftdi get_signal", with no JTAG
# shifting, so the value is not contaminated by TCK/TDI crosstalk. Use it while
# probing wires: the reading is meaningful only if it is STABLE across repeated
# runs, and only if it CHANGES when the FPGA changes what it drives on D6.
#
#   sudo <sdk>/openocd -f hardware/openocd/tdo-sense.cfg
#   -> "Signal TDO_SENSE = 000000"
#
# Continuity test with no meter, using two bitstreams that differ at D6:
#   1. load RocketKU040Config (D6 = driven output, PULLUP)   -> sense
#   2. load spiOverJtag_xcku040-sfva784 (D6 floats, PULLNONE) -> sense
# If the two readings are identical, D6 is not reaching the adapter and the
# break is on the adapter side. If they differ, the path is intact.
#
# The chain-scan errors printed during init are expected and irrelevant here;
# only the "Signal TDO_SENSE" lines matter.

adapter driver ftdi
# Both MPSSE PIDs: 0x6010 is the FT2232H, 0x6011 the FT4232H. No
# device_desc -- it rejects whichever of "Dual"/"Quad RS232-HS" is not
# named, and cannot separate two blank-EEPROM adapters anyway.
ftdi vid_pid 0x0403 0x6010 0x0403 0x6011
ftdi channel 0
adapter speed 1000
ftdi layout_init 0x0B00 0x0B0B
ftdi layout_signal nSRST -data 0x0100 -oe 0x0100
ftdi layout_signal nTRST -data 0x0200 -oe 0x0200
ftdi layout_signal TDO_SENSE -input 0x0004
reset_config none
transport select jtag
jtag newtap t tap -irlen 5 -expected-id 0
init
# direct calls





for {set i 0} {$i < 48} {incr i} { ftdi get_signal TDO_SENSE; sleep 25 }
shutdown
