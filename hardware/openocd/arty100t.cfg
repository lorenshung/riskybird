# One-hart Rocket debug target on the Arty100T shell.
set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5

set _TARGETNAME $_CHIPNAME.cpu0
target create $_TARGETNAME riscv -chain-position $_CHIPNAME.cpu -coreid 0
$_TARGETNAME configure \
	-work-area-phys 0x80001000 \
	-work-area-size 0x1000 \
	-work-area-backup 1

init
halt
echo "RiskyBird Arty100T is ready for GDB"
