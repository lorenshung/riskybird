# Extends bootup_check.conf semantics from prj.conf; it does not replace it.
#
# CONFIG_PWM stays OFF in this mode too. The motor sweep sends motor_link duty
# frames to the ESP32 over uart1 (the ESP owns the gates), so this image never
# runs pwm_sifive_init() and never changes what the FPGA's motor pins drive.
# The mode is selected by -DBOOTUP_MOTORS=1 (cppflags_by_mode in boards.py).
CONFIG_UART_SIFIVE_PORT_1=y
